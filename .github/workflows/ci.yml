name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    # Pinned to the base of the target distro (Mint 22 / Ubuntu 24.04). The
    # ubuntu-latest image moved to 26.04, where xclip image transfer into GTK3
    # fails and the smoke test cannot pass.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test --all

      - name: build (release)
        run: cargo build --release

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK, xclip and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev xclip xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: End-to-end smoke test
        # Invoked via `bash` on purpose: some checkouts (e.g. Windows filesystems
        # without the execute bit) cannot represent the +x flag.
        run: bash scripts/smoke-test.sh
